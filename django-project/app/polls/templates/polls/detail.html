<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ question.question_text }} | Thăm dò Ý kiến</title>
<!-- Tải Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Load Static Files (BẮT BUỘC TRONG DJANGO) -->
{% load static %}

<!-- Bạn có thể tải các file CSS và JS tĩnh khác ở đây -->
<link rel="stylesheet" href="{% static 'polls/styles.css' %}">
<script src="{% static 'polls/tailwind_config.js' %}"></script>

<style>
    /* Tùy chỉnh nhỏ để đảm bảo radio button được ẩn và label được tạo kiểu */
    .choice-radio:checked + .choice-label {
        background-color: #f0f9ff; /* Blue-50 */
        border-color: #3b82f6; /* Blue-500 */
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
    }
    .choice-label {
        transition: all 0.2s;
    }
</style>


</head>
<body class="bg-gray-50 flex items-start justify-center pt-10 px-4 font-sans">

<!-- Container Chính -->
<div class="w-full max-w-xl bg-white shadow-2xl rounded-3xl p-6 md:p-10 border border-gray-100">

    <!-- Tiêu đề / Câu hỏi -->
    <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 border-b pb-4 mb-8 text-center leading-tight">
        {{ question.question_text }}
    </h1>

    <!-- Form Bầu chọn -->
    <!-- Action: URL 'polls:vote' và method POST. {% csrf_token %} là bắt buộc cho POST trong Django -->
    <form action="{% url 'polls:vote' question.id %}" method="post">
        {% csrf_token %}

        <!-- Thông báo lỗi (nếu có) -->
        {% if error_message %}
            <p class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl mb-6 font-medium text-sm">
                <span class="font-bold mr-2">Lỗi:</span> {{ error_message }}
            </p>
        {% endif %}

        <!-- Danh sách các lựa chọn -->
        <fieldset class="space-y-4">
            <legend class="sr-only">Lựa chọn của câu hỏi</legend>

            {% for choice in question.choice_set.all %}
                <div class="relative">
                    <!-- Radio Button (ẩn đi để tạo kiểu bằng label) -->
                    <input type="radio"
                           name="choice"
                           id="choice{{ forloop.counter }}"
                           value="{{ choice.id }}"
                           class="sr-only choice-radio">

                    <!-- Label được tạo kiểu -->
                    <label for="choice{{ forloop.counter }}"
                           class="choice-label flex items-center justify-between p-4 md:p-5 cursor-pointer
                                  bg-white border-2 border-gray-200 rounded-xl
                                  hover:bg-gray-50 hover:border-gray-300
                                  text-lg md:text-xl font-medium text-gray-700 shadow-sm
                                  w-full">

                        <!-- Văn bản lựa chọn -->
                        <span>{{ choice.choice_text }}</span>

                        <!-- Dấu kiểm tùy chỉnh (sử dụng icon khi được chọn) -->
                        <svg class="h-6 w-6 text-blue-500 hidden checkmark-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </label>
                </div>

                <!-- Script nhỏ để hiện dấu kiểm khi chọn (chỉ chạy khi HTML được render) -->
                <script>
                    document.getElementById('choice{{ forloop.counter }}').addEventListener('change', function() {
                        // Ẩn tất cả dấu kiểm
                        document.querySelectorAll('.checkmark-icon').forEach(icon => icon.classList.add('hidden'));

                        // Hiện dấu kiểm cho lựa chọn hiện tại
                        if (this.checked) {
                            this.nextElementSibling.querySelector('.checkmark-icon').classList.remove('hidden');
                        }
                    });
                </script>
            {% endfor %}
        </fieldset>

        <!-- Nút Bầu chọn -->
        <div class="mt-8">
            <button type="submit"
                    class="w-full py-3 px-6 bg-blue-600 text-white font-bold text-xl rounded-xl
                           hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50
                           transition duration-200 transform hover:scale-[1.01] shadow-lg">
                Bầu chọn ngay!
            </button>
        </div>
    </form>

    <!-- Các liên kết phụ (Kết quả, Quay lại) -->
    <div class="mt-8 flex justify-center space-x-6 pt-6 border-t border-gray-100">
        <a href="{% url 'polls:results' question.id %}"
           class="text-sm font-semibold text-blue-600 hover:text-blue-800 transition duration-150">
            Xem Kết quả
        </a>
        <span class="text-gray-300">|</span>
        <a href="{% url 'polls:index' %}"
           class="text-sm font-semibold text-gray-500 hover:text-gray-700 transition duration-150">
            Quay lại danh sách
        </a>
    </div>

</div>


</body>
</html>
